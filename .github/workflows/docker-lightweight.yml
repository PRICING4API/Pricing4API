name: Build and Push Lightweight Docker Image

on:
  push:
    branches:
      - refactor/rgavira  # O la rama que quieras

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout del repositorio
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Loguearse en Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Reconstruct .env file
        run: |
          echo "${{ secrets.ENV_BASE64 }}" | base64 --decode > .env

      # 3. Construir la imagen lightweight con tag 'lightweight'
      - name: Build Lightweight Docker image
        run: |
          IMAGE_NAME=rgavira123/pricing4api
          docker build -f docker/Dockerfile.lightweight -t $IMAGE_NAME:lightweight .

      # 4. Subir la imagen al Docker Hub
      - name: Push Lightweight Docker image
        run: |
          IMAGE_NAME=rgavira123/pricing4api
          docker push $IMAGE_NAME:lightweight
